<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رياضيات الصف التاسع – صفحة 148</title>

    <style>
        /* ===== الأساس ===== */
        body {
            margin: 0;
            background: #ffffff;
            font-family: "Amiri", "Times New Roman", serif;
            color: #000;
        }

        .page {
            max-width: 820px;
            margin: auto;
            padding: 36px 40px 60px;
            min-height: 1350px;
            box-sizing: border-box;
            font-size: 19px;
            line-height: 2.35;
        }

        /* ===== الترويسة ===== */
        .top-line {
            border-top: 3px solid #19a7d8;
            margin-bottom: 18px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            font-size: 15px;
            margin-bottom: 36px;
        }

        /* ===== عنوان الحل ===== */
        .solution-title {
            display: inline-block;
            border: 2px solid #000;
            border-radius: 22px;
            padding: 6px 22px;
            font-weight: bold;
            margin-bottom: 32px;
        }

        /* ===== فقرات ===== */
        .p {
            margin: 12px 0;
        }

        /* ===== معادلات ===== */
        .eq {
            margin: 26px 0;
            text-align: center;
        }

        /* ===== كسر ===== */
        .frac {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            vertical-align: middle;
        }

        .frac .top {
            padding: 0 10px;
        }

        .frac .bar {
            width: 100%;
            border-top: 2px solid #000;
            margin: 4px 0;
        }

        .frac .bottom {
            padding: 0 10px;
        }

        /* ===== جذر ===== */
        .sqrt {
            display: inline-flex;
            align-items: flex-start;
        }

        .sqrt-symbol {
            font-size: 1.35em;
            margin-left: 4px;
        }

        .sqrt-content {
            border-top: 2px solid #000;
            padding: 0 8px;
            margin-top: 8px;
        }

        /* ===== فواصل كبيرة ===== */
        .section-gap {
            margin-top: 42px;
        }

        /* ===== التذييل ===== */
        .footer {
            margin-top: 130px;
            position: relative;
        }

        .footer-line {
            border-top: 3px solid #19a7d8;
        }

        .page-number {
            position: absolute;
            right: 0;
            top: -26px;
            border: 3px solid #19a7d8;
            border-radius: 50%;
            padding: 6px 18px;
            font-weight: bold;
        }

        .footer-link {
            text-align: center;
            margin-top: 16px;
            color: #1a5fd9;
            font-size: 16px;
        }

        /* ===== الجوال ===== */
        @media (max-width:480px) {
            .page {
                font-size: 18px;
                padding: 28px 18px 50px;
                line-height: 2.35;
                min-height: 1150px;
            }
        }
    </style>
</head>

<body>
    <div class="page">

        <div class="top-line"></div>

        <div class="header">
            <div>المعادلات</div>
            <div>الوحدة الثالثة</div>
        </div>

        <div class="solution-title">الحل :</div>

        <div class="p">(أ) أ = ١ ، ب = −٤ ، ج = −٥</div>

        <div class="eq">
            ∴ س =
            <span class="frac">
                <span class="top">
                    −ب ±
                    <span class="sqrt">
                        <span class="sqrt-symbol">√</span>
                        <span class="sqrt-content">ب² − ٤أج</span>
                    </span>
                </span>
                <span class="bar"></span>
                <span class="bottom">٢أ</span>
            </span>
        </div>

        <div class="eq">
            =
            <span class="frac">
                <span class="top">
                    −(−٤) ±
                    <span class="sqrt">
                        <span class="sqrt-symbol">√</span>
                        <span class="sqrt-content">(−٤)² − ٤ × ١ × (−٥)</span>
                    </span>
                </span>
                <span class="bar"></span>
                <span class="bottom">٢ × ١</span>
            </span>
        </div>

        <div class="eq">
            =
            <span class="frac">
                <span class="top">
                    ٤ ±
                    <span class="sqrt">
                        <span class="sqrt-symbol">√</span>
                        <span class="sqrt-content">١٦ + ٢٠</span>
                    </span>
                </span>
                <span class="bar"></span>
                <span class="bottom">٢</span>
            </span>
        </div>

        <div class="eq">
            =
            <span class="frac">
                <span class="top">
                    ٤ ±
                    <span class="sqrt">
                        <span class="sqrt-symbol">√</span>
                        <span class="sqrt-content">٣٦</span>
                    </span>
                </span>
                <span class="bar"></span>
                <span class="bottom">٢</span>
            </span>
        </div>

        <div class="eq">
            =
            <span class="frac">
                <span class="top">٤ ± ٦</span>
                <span class="bar"></span>
                <span class="bottom">٢</span>
            </span>
        </div>

        <div class="p">∴ إما س = ٥</div>
        <div class="p">أو س = −١</div>

        <div class="p">∴ مجموعة الحل = { −١ ، ٥ }</div>

        <div class="section-gap p">(ب) أ = ١ ، ب = −٤ ، ج = ٤</div>

        <div class="footer">
            <div class="footer-line"></div>
            <div class="page-number">١٤٨</div>
            <div class="footer-link">http://www.e-learning-moe.edu.ye/</div>
        </div>

    </div>
</body>

</html>
